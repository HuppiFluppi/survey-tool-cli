[package]
name = "survey-tool-cli"
description = "Command line tool accompanying the survey-tool. Allows operations on survey configuration files."
authors = ["Felix Zinkel"]
license = "MIT"
version = "0.7.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.2", features = ["cargo", "derive"] }
colored = "3.1.1"
jsonschema = "0.48.1"
regex = "1.13.1"
serde-saphyr = "0.0.29"
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
inquire = "0.9.4"
strum = { version = "0.28", features = ["derive"] }
