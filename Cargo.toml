[package]
name = "survey-tool-cli"
description = "Command line tool accompanying the survey-tool. Allows operations on survey configuration files."
authors = ["Felix Zinkel"]
license = "MIT"
version = "0.6.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["cargo", "derive"] }
colored = "3.1.1"
jsonschema = "0.46.5"
regex = "1.12.4"
serde-saphyr = "0.0.27"
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
inquire = "0.9.4"
strum = { version = "0.28", features = ["derive"] }
