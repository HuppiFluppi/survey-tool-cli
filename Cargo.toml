[package]
name = "survey-tool-cli"
description = "Command line tool accompanying the survey-tool. Allows operations on survey configuration files."
authors = ["Felix Zinkel"]
license = "MIT"
version = "0.4.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.57", features = ["cargo", "derive"] }
colored = "3.1.1"
jsonschema = "0.41.0"
regex = "1.12.3"
serde-saphyr = "0.0.17"
serde_json = "1.0.149"
